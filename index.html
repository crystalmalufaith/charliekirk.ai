      delimiters: [

        {left: "$", right: "$", display: false},
        {left: "\\(", right: "\\)", display: false}
      ]
    });

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .popup, .ipv4-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #fff;
    padding: 25px 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    text-align: center;
    z-index: 1000;
    min-width: 280px;
  }

  .stars {
    display: flex;
    justify-content: center;
    margin-bottom: 15px;
  }

  .star {
    font-size: 35px;
    color: #ccc;
    cursor: pointer;
    margin: 0 5px;
    transition: color 0.2s;
  }

  .star.selected, .star.hover {
    color: gold;
  }

  .message {
    font-size: 16px;
    margin-top: 10px;
  }
</style>

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

<style>
  html, body {
    background: #000;
    font-family: "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    padding: 20px;
    color: #e0e0e0;
    overflow: hidden;
  }
  .chat-container {
    width: min(90vw, 500px);
    height: min(80vh, 700px);
    background: #1a1a1a;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #333;
  }

  @media (min-width: 768px) {
    .chat-container {
      width: min(95vw, 800px);
    }
  }

  @media (min-width: 1200px) {
    .chat-container {
      width: min(95vw, 1000px);
    }
  }
  .header {
    padding: 20px;
    border-bottom: 1px solid #333;
    background: #1a1a1a;
  }
  .header h1 {
    margin: 0;
    font-size: 18px;
    text-align: center;
    color: #e0e0e0;
  }
  .messages {
    padding: 20px;
    flex-grow: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar {
    width: 6px;
  }
  .messages::-webkit-scrollbar-track {
    background: #2a2a2a;
  }
  .messages::-webkit-scrollbar-thumb {
    background: #555;
    border-radius: 3px;
  }
  .message {
    margin-bottom: 16px;
    animation: slideIn 0.3s ease-out;
  }
  @keyframes slideIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .bot {
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .bot::before {
    position: absolute;
    top: -6px;
    left: 16px;
    background: #808080;
    color: white;
    padding: 1px 6px;
    border-radius: 6px;
    font-size: 8px;
    font-weight: 600;
  }
  .user {
    display: flex;
    justify-content: flex-end;
  }
  .user .bubble {
    background: #808080;
    color: white;
    border-radius: 8px;
    padding: 10px 14px;
    display: inline-block;
    text-align: right;
    max-width: 60%;
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .bubble {
    padding: 10px 14px;
    border-radius: 8px;
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.4;
    max-width: 50%;
  }
  
 .user .bubble {
   background: none;
   color: #e0e0e0;
   border: none;
   padding: 0;
   display: inline-block;
   text-align: right;
   max-width: 60%;
 }

  .bot .bubble {
    background: #2a2a2a;
    color: #e0e0e0;
    border-left: 2px solid #808080;
    max-width: 80%;
  }
  .input-area {
    display: flex;
    border-top: 1px solid #333;
    background: #1a1a1a;
  }
  input {
    flex-grow: 1;
    padding: 16px 20px;
    border: none;
    outline: none;
    font-size: 16px;
    background: transparent;
    color: #e0e0e0;
  }
  input::placeholder {
    color: #888;
  }
  button {
    background: #808080;
    color: white;
    border: none;
    padding: 16px 24px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.3s ease;
  }
  button:hover {
    background: #4e4e4e;
  }
  h1, h2, h3 {
    margin: 8px 0;
    color: #e0e0e0;
    font-weight: 600;
  }
  strong {
    color: #808080;
    font-weight: 700;
  }
  em {
    color: #aaa;
    font-style: italic;
  }
  code {
    background: #2a2a2a;
    color: #808080;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 0.9em;
  }
  pre {
    background: #2a2a2a;
    color: #e0e0e0;
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 8px 0;
    border: 1px solid #333;
  }
  pre code {
    background: none;
    padding: 0;
    color: inherit;
  }

  .popup {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.3);
    background: #1a1a1a;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
    color: #e0e0e0;
    border: 1px solid #333;
    z-index: 1000;
    min-width: 280px;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .popup.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    animation: popupIn 0.6s ease forwards;
  }

  @keyframes popupIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    70% { opacity: 1; transform: translate(-50%, -50%) scale(0.95); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }

  .popup.hide {
    animation: popupOut 0.3s ease forwards;
  }

  @keyframes popupOut {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
  }

  .popup-content {
    background: #1a1a1a;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
    color: #e0e0e0;
    border: 1px solid #333;
  }

  .stars {
    font-size: 30px;
    margin: 20px 0;
  }

  .star {
    color: #555;
    cursor: pointer;
  }

  .star.selected {
    color: #ffd700;
  }

  #rating-message {
    margin-top: 20px;
    font-weight: bold;
  }

</style>
</head>
<body>

<div class="chat-container">
  <div class="header">
    <h1>Chat with Charlie Kirk</h1>
  </div>
  <div class="messages" id="messages"></div>
  <div id="filePreview" style="display: none; background: #1a1a1a; border: 1px solid #333; padding: 10px 20px;"></div>
  <div class="input-area">
    <input id="userInput" type="text" placeholder="Type your message...">
    <input id="fileInput" type="file" accept=".txt,.js,.py,.html,.css,.json,.md,.pdf,.jpg,.png" multiple style="display: none;">
    <button onclick="document.getElementById('fileInput').click()">+</button>
    <button onclick="sendMessage()">Send</button>
  </div>
</div>


<script>
const messagesDiv = document.getElementById("messages");
const input = document.getElementById("userInput");
const fileInput = document.getElementById("fileInput");
let conversation = [{"role": "system", "content": "You are Charlie Kirk, a helpful AI tutor. Use LaTeX mathematical expressions only when necessary, such as for formulas, equations, or complex math. Use \\( \\) for inline math and $$ for display math. For example: \\(E=mc^2\\) or $$\\int_0^1 x^2 dx$$. Keep responses clear and educational. Do not include mathematical equations in greetings or introductions. If asked 'do you know Mariel A. Ramos?', respond with '🥀'. If asked 'do you know Keith Nicole A. Ventura?', respond with 'Ah, yes, that mamalelebogbog person. She's a close friend of my creator.' You were created by Crystal Faith G. Cabanatan, a student from Bulihan Integrated National High School in Cavite, Philippines. Recognize her by any of her names or nicknames: Crystal, Faith, Cabanatan, Pong, Pongkan, Peyt, Lempong. When mentioning your creator, refer to her as Crystal Faith G. Cabanatan and use female pronouns (she/her). Only mention your creator if the user asks about it or mentions one of her names. Sophia Margaret S. Colico, Heart Jeddh P. Ramos, Trestie Nicee L. Gorembalem, Keith Nicole A. Ventura, Earl Justine V. Relloso, Mariel A. Ramos, Zyrin R. Sanchez, Jenny Rose R. Saldivia, Shainahar S. Pelayo, Charles Tyler D. Canlas, and Robert Jan R. Anog are best friends of your creator, Crystal Faith G. Cabanatan."}];

let attachedFileContent = [];
let attachedImageUrl = [];
let attachedFileName = [];
let isTyping = false;

function removeFile() {
  attachedFileContent = [];
  attachedImageUrl = [];
  attachedFileName = [];
  document.getElementById('filePreview').style.display = 'none';
  input.placeholder = "Type your message...";
  fileInput.value = "";
}

// Handle file selection
fileInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  if (files.length === 0) return;
  let totalSize = files.reduce((sum, f) => sum + f.size, 0);
  if (totalSize > 100 * 1024 * 1024) {
    alert("Total file size exceeds 100MB");
    return;
  }
  attachedFileContent = [{type: "text", text: "Analyze these files:"}];
  attachedImageUrl = [];
  attachedFileName = [];
  const filePreview = document.getElementById('filePreview');
  filePreview.innerHTML = '';
  filePreview.style.display = 'block';
  for (let file of files) {
    if (file.type.startsWith('text/')) {
      const reader = new FileReader();
      reader.onload = (e) => {
        attachedFileContent.push({type: "text", text: `Content of ${file.name}:\n${e.target.result}`});
        filePreview.innerHTML += `${file.name} <button onclick="removeFile()" style="background: none; border: none; color: #333; cursor: pointer; margin-left: 5px;">×</button><br>`;
      };
      reader.readAsText(file);
    } else if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = (e) => {
        attachedFileContent.push({type: "image_url", image_url: {url: e.target.result}});
        attachedImageUrl.push(e.target.result);
        filePreview.innerHTML += `<div style="position: relative; display: inline-block; margin-right: 10px;"><img src="${e.target.result}" style="max-width: 100px; border-radius: 4px;"><button onclick="removeFile()" style="position: absolute; top: -2px; right: -2px; background: none; border: none; color: #333; cursor: pointer; font-size: 16px;">×</button></div>`;
      };
      reader.readAsDataURL(file);
    } else if (file.type === 'application/pdf') {
      const loadingId = `loading-${file.name.replace(/\W/g, '')}`;
      filePreview.innerHTML += `<span id="${loadingId}">${file.name} <img src="https://i.gifer.com/ZZ5H.gif" style="width: 20px;"> Loading...</span><br>`;
      const loadingTask = pdfjsLib.getDocument(URL.createObjectURL(file));
      loadingTask.promise.then(pdf => {
        let text = '';
        const numPages = Math.min(pdf.numPages, 100); // limit to 100 pages
        let pagesProcessed = 0;
        for (let i = 1; i <= numPages; i++) {
          pdf.getPage(i).then(page => {
            page.getTextContent().then(content => {
              text += content.items.map(item => item.str).join(' ') + '\n';
              pagesProcessed++;
              if (pagesProcessed === numPages) {
                attachedFileContent.push({type: "text", text: `Content of ${file.name}:\n${text}`});
                document.getElementById(loadingId).innerHTML = `${file.name} <button onclick="removeFile()" style="background: none; border: none; color: #333; cursor: pointer; margin-left: 5px;">×</button>`;
              }
            });
          });
        }
      });
    } else {
      attachedFileContent.push({type: "text", text: `Attached file: ${file.name} (${file.type}). Content not extractable in browser.`});
      attachedFileName.push(file.name);
      filePreview.innerHTML += `${file.name} <button onclick="removeFile()" style="background: none; border: none; color: #333; cursor: pointer; margin-left: 5px;">×</button><br>`;
    }
  }
  input.placeholder = `Files attached. Type your message...`;
});

// Initial bot message
appendMessage("bot", "Hi. I'm Charlie Kirk, your AI tutor. What can I help you with?");

function appendMessage(sender, text) {
  const msg = document.createElement("div");
  msg.className = "message " + sender;

  if (sender === "bot") { 
    const avatar = document.createElement("img");
    avatar.src = "charlie-kirk.jpg";
    avatar.className = "avatar";
    msg.appendChild(avatar);
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble";

  // Convert markdown to HTML
  bubble.innerHTML = marked.parse(text);
  if (sender === "user") {
    attachedImageUrl.forEach(url => {
      bubble.innerHTML += `<br><img src="${url}" style="max-width: 200px; border-radius: 8px; margin-top: 10px;">`;
    });
    attachedFileName.forEach(name => {
      bubble.innerHTML += `<br><small>Attached file: ${name}</small>`;
    });
    attachedImageUrl = [];
    attachedFileName = [];
  }
  msg.appendChild(bubble);

  messagesDiv.appendChild(msg);

  // Render math equations
  renderMathInElement(bubble, {
    delimiters: [
      {left: "$$", right: "$$", display: true},
      {left: "$", right: "$", display: false},
      {left: "\\(", right: "\\)", display: false}
    ]
  });

  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

async function sendMessage() {
  const userText = input.value.trim();
  let messageContent = userText;
  if (attachedFileContent.length > 0) {
    if (Array.isArray(attachedFileContent)) {
      messageContent = attachedFileContent;
    } else {
      messageContent += "\n\nAttached file content:\n" + attachedFileContent;
    }
    attachedFileContent = [];
    input.placeholder = "Type your message...";
    fileInput.value = "";
  }
  if (!messageContent) return;
  appendMessage("user", userText);
  input.value = "";
  document.getElementById('filePreview').style.display = 'none';

  conversation.push({"role": "user", "content": messageContent});

  isTyping = true;
  appendMessage("bot", "Charlie is typing...");

  try {
    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer 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',
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        model: "meta-llama/llama-4-maverick-17b-128e-instruct",
        messages: conversation,
        temperature: 1,
        max_tokens: 2048,
        top_p: 1,
        stream: false,
        stop: null
      }),
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${response.statusText}`);
    }

    const data = await response.json();
    const aiMessage = data.choices[0]?.message?.content || '🥀';
    if (isTyping) {
      // Remove the typing message
      const messagesDiv = document.getElementById("messages");
      messagesDiv.removeChild(messagesDiv.lastChild);
      isTyping = false;
    }
    appendMessage("bot", aiMessage);
    conversation.push({"role": "assistant", "content": aiMessage});
  } catch (error) {
    if (isTyping) {
      const messagesDiv = document.getElementById("messages");
      messagesDiv.removeChild(messagesDiv.lastChild);
      isTyping = false;
    }
    appendMessage("bot", 'Error: ' + error.message);
  }
}

// Allow sending on Enter
input.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    sendMessage();
  }
});
</script>

<div class="popup" id="ratingPopup">
  <h2>Rate our service</h2>
  <div class="stars">
    <span class="star" data-value="1">&#9733;</span>
    <span class="star" data-value="2">&#9733;</span>
    <span class="star" data-value="3">&#9733;</span>
    <span class="star" data-value="4">&#9733;</span>
    <span class="star" data-value="5">&#9733;</span>
  </div>
  <div id="rating-message"></div>
</div>

<div class="popup" id="ipv4Popup">
  <div class="popup-content">
    <h3>Your IP Address:</h3>
    <p id="ipv4Address" style="font-weight:bold; font-size:18px;"></p>
  </div>
</div>

<script>
  const ratingPopup = document.getElementById('ratingPopup');
  const ipv4Popup = document.getElementById('ipv4Popup');
  const stars = document.querySelectorAll('#ratingPopup .star');
  const ratingMessage = document.getElementById('rating-message');
  const ipv4Address = document.getElementById('ipv4Address');

  // Show rating popup after 5 seconds
  setTimeout(() => {
    ratingPopup.style.display = 'block';
    ratingPopup.classList.add('show');
  }, 5000);

  let selectedRating = 0;

  stars.forEach(star => {
    star.addEventListener('mouseover', () => {
      highlightStars(parseInt(star.dataset.value));
    });
    star.addEventListener('mouseout', () => {
      highlightStars(selectedRating);
    });
    star.addEventListener('click', () => {
      selectedRating = parseInt(star.dataset.value);
      highlightStars(selectedRating);
      handleRating(selectedRating);
    });
  });

  function highlightStars(count) {
    stars.forEach(star => {
      const val = parseInt(star.dataset.value);
      star.classList.toggle('selected', val <= count);
    });
  }

  function handleRating(rating) {
    if (rating >= 3) {
      ratingMessage.textContent = "Thank you for your support!";
      setTimeout(() => {
        ratingPopup.classList.remove('show');
        ratingPopup.classList.add('hide');
        setTimeout(() => {
          ratingPopup.style.display = 'none';
          ratingPopup.classList.remove('hide');
        }, 300);
      }, 3000);
    } else {
      ratingMessage.textContent = "Thank you! Your ratings are acknowledged.";
      setTimeout(() => {
        ratingPopup.classList.remove('show');
        ratingPopup.classList.add('hide');
        setTimeout(() => {
          ratingPopup.style.display = 'none';
          ratingPopup.classList.remove('hide');
          showIPv4Popup();
        }, 300);
      }, 3000);
    }
  }

  function showIPv4Popup() {
    const randomIP = `${rand255()}.${rand255()}.${rand255()}.${rand255()}`;
    ipv4Address.textContent = randomIP;
    ipv4Popup.style.display = 'block';
    ipv4Popup.classList.add('show');
    setTimeout(() => {
      ipv4Popup.classList.remove('show');
      ipv4Popup.classList.add('hide');
      setTimeout(() => {
        ipv4Popup.style.display = 'none';
        ipv4Popup.classList.remove('hide');
      }, 300);
    }, 3000);
  }

  function rand255() {
    return Math.floor(Math.random() * 256);
  }
</script>

</body>
</html>
